appId: com.dsh.desktop
productName: DSH Desktop
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - renderer/**/*
  - package.json
  - "!**/*.map"
asar: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
