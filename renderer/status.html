<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>status</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { user-select: none; }
    .pill {
      display: flex; align-items: center; height: 100%;
      padding: 0 10px; gap: 9px; box-sizing: border-box;
      border-radius: 9px; background: rgba(19, 22, 29, 0.94);
      border: 1px solid #2a3140; color: #9aa4b2; font-size: 12px;
      -webkit-app-region: drag;
    }
    .item { -webkit-app-region: no-drag; cursor: pointer; white-space: nowrap; }
    .item strong { color: #e6e6e6; font-weight: 600; }
    .item.on { color: #4f8cff; }
    .sep { color: #333a48; }
    .btn {
      -webkit-app-region: no-drag; margin-left: 2px;
      padding: 2px 8px; border-radius: 6px; border: 1px solid #2a3140;
      background: #1a1f29; color: #e6e6e6; font-size: 11px; cursor: pointer; line-height: 1.4;
    }
    .btn:hover { border-color: #4f8cff; color: #4f8cff; }
  </style>
</head>
<body>
  <div class="pill" id="pill" title="点击查看完整状态明细；空白处可拖动">
    <span class="item" id="balance"><strong>余额 …</strong></span>
    <span class="sep">·</span>
    <span class="item"><strong id="total">…</strong> 总</span>
    <span class="sep">·</span>
    <span class="item"><strong id="current">…</strong> 当前</span>
    <span class="sep">·</span>
    <span class="item"><strong id="cache">…</strong> 缓存</span>
    <span class="sep">·</span>
    <span class="item"><strong id="rate">…</strong>/s</span>
    <span class="sep">·</span>
    <span class="item" id="jobs">任务 0</span>
    <span class="sep">·</span>
    <span class="item" id="subagents">子代理 0</span>
    <button class="btn" id="refresh" title="立即刷新最新状态">⟳ 刷新</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    function scaled(v) { return v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10) }
    function fmtTokens(n) {
      if (n < 1000) return String(n)
      if (n < 1000000) return scaled(n / 1000) + 'K'
      return scaled(n / 1000000) + 'M'
    }
    function fmtSymbol(code) { return { CNY: '¥', USD: '$', EUR: '€' }[code] ?? (code + ' ') }

    window.__renderStatus = (status) => {
      const s = status || {}
      const bal = s.balance
      $('balance').innerHTML = (bal && bal.status === 'ready' && bal.rows && bal.rows.length)
        ? '<strong>' + fmtSymbol(bal.rows[0].currency) + bal.rows[0].totalBalance + '</strong>'
        : '<strong>余额 –</strong>'
      const t = s.tokens || {}
      $('total').textContent = fmtTokens(t.total || 0)
      $('current').textContent = fmtTokens(t.current || 0)
      const ratio = t.cacheRatio === undefined ? '' : ' ' + Math.round(t.cacheRatio * 100) + '%'
      $('cache').textContent = fmtTokens(t.cacheRead || 0) + ratio
      const rps = t.rate
      $('rate').textContent = rps === undefined ? '–' : (rps >= 1 ? scaled(rps) : scaled(rps * 60))
      const jobs = s.jobs || []
      $('jobs').textContent = '任务 ' + jobs.length
      $('jobs').classList.toggle('on', jobs.length > 0)
      const subs = s.subagents || []
      $('subagents').textContent = '子代理 ' + subs.length
      $('subagents').classList.toggle('on', subs.length > 0)
    }

    $('refresh').addEventListener('click', async (e) => {
      e.stopPropagation()
      const btn = $('refresh')
      btn.textContent = '⟳ …'
      btn.disabled = true
      try {
        await window.__dshStatus.refresh()
      } finally {
        btn.textContent = '⟳ 刷新'
        btn.disabled = false
      }
    })

    $('pill').addEventListener('click', (e) => {
      if (e.target === $('refresh')) return
      window.__dshStatus.details()
    })
  </script>
</body>
</html>
