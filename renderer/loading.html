<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .box { text-align: center; padding: 0 28px; }
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid #3a4150;
      border-top-color: #4f8cff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
    .status {
      font-size: 13px;
      color: #9aa4b2;
      word-break: break-all;
      max-height: 64px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="box">
    <div><span class="spinner"></span></div>
    <div class="title">DeepSeek Harness</div>
    <div class="status" id="status">正在初始化…</div>
  </div>
  <script>
    // Called from the main process via executeJavaScript to update the status line.
    function setStatus(text) {
      var el = document.getElementById('status');
      if (el && text) el.textContent = text;
    }
  </script>
</body>
</html>
